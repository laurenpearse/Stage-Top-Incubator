; =====================================================================
;  I2C bench test: ADS1115 + SCD30
; =====================================================================

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = arduino

lib_deps =
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit MAX31865 library
    sparkfun/SparkFun SCD30 Arduino Library

monitor_speed = 115200
monitor_filters = default, log2file, time